name: Mise à jour des prix

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # aux 15 minutes
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  maj:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install openpyxl==3.1.5

      - name: Télécharger le fichier de la Régie
        id: regie
        continue-on-error: true
        run: python scripts/maj.py site/stations.json

      - name: Historique des prix
        continue-on-error: true
        run: python scripts/historique.py

      - name: Alertes de prix
        continue-on-error: true
        run: python scripts/alertes.py ${{ steps.regie.outcome }}

      # Enregistre l'état des alertes et la copie quotidienne de l'historique.
      # Ce commit garde aussi le dépôt actif (GitHub met en pause les tâches
      # programmées d'un dépôt public inactif depuis 60 jours).
      - name: Enregistrer dans le dépôt
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Données $(date -u +'%F %H:%M')"
            git pull --rebase --autostash -X theirs origin main || true
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
